# MeFit trial deployment on Render.
# Evaluation only: reuse the existing Render Postgres database for both API and Keycloak.
# Free services are for evaluation only: Postgres expires after 30 days and has no backups.
services:
  - type: web
    name: mefit-api-sukumar
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    initialDeployHook: npm run db:seed:prod --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://mefit-web-sukumar.onrender.com
      - key: API_PUBLIC_ORIGIN
        value: https://mefit-api-sukumar.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: MeFit
          property: connectionString
      - key: OIDC_ISSUER
        value: https://mefit-auth-sukumar.onrender.com/realms/mefit
      - key: OIDC_AUDIENCE
        value: mefit-api
      - key: OIDC_CLIENT_ID
        value: mefit-web

  - type: web
    name: mefit-auth-sukumar
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: infra/keycloak-prod/Dockerfile
    dockerContext: .
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: MeFit
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: MeFit
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: MeFit
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: MeFit
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: MeFit
          property: password
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: mefit-admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HOSTNAME
        value: https://mefit-auth-sukumar.onrender.com
      - key: KC_HOSTNAME_STRICT
        value: "true"
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_METRICS_ENABLED
        value: "true"
      - key: MEFIT_SMTP_HOST
        sync: false
      - key: MEFIT_SMTP_PORT
        sync: false
      - key: MEFIT_SMTP_FROM
        sync: false
      - key: MEFIT_SMTP_USERNAME
        sync: false
      - key: MEFIT_SMTP_PASSWORD
        sync: false

  - type: web
    name: mefit-web-sukumar
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://mefit-api-sukumar.onrender.com/api
      - key: VITE_OIDC_AUTHORITY
        value: https://mefit-auth-sukumar.onrender.com/realms/mefit
      - key: VITE_OIDC_CLIENT_ID
        value: mefit-web
      - key: VITE_OIDC_REDIRECT_URI
        value: https://mefit-web-sukumar.onrender.com/auth/callback
