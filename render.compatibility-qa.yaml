services:
  - type: web
    name: mefit-compatibility-qa-sukumar
    runtime: docker
    region: virginia
    plan: free
    autoDeployTrigger: off
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh apps/api/scripts/start-compatibility-qa.sh
    healthCheckPath: /ready
    envVars:
      - key: AUTH_PROVIDER
        value: dual
      - key: QA_DISPOSABLE_DATABASE_URL
        fromDatabase:
          name: mefit-compatibility-qa-db
          property: connectionString
      - key: QA_EXPECTED_DATABASE_HOST
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        value: mefit-compatibility-qa
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: WEB_ORIGIN
        sync: false
databases:
  - name: mefit-compatibility-qa-db
    databaseName: mefit_compatibility_qa
    user: mefit_compatibility_qa
    region: virginia
    plan: free
    ipAllowList: []
